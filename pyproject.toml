[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bazzar-terminal"
version = "1.8.0"
description = "Bazzar Terminal - local data layer, API, and desktop shell"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
packages = ["backend", "quant"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "scipy.*", "requests.*", "keyring.*", "keyrings.*", "duckdb"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
